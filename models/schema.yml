models:
  - name: dim_listings_cleansed
    description: "This model contains the cleansed listings data for Airbnb."
    data_tests:
    - minimum_row_counts:
        arguments:
          min_rows: 1000000
          severity: warn
    columns:

     - name: listing_id
       description: "Unique identifier for each listing."
       data_tests:
         - unique
         - not_null

     - name: host_id
       description: "Identifier for the host of each listing. also references the host_id in the dim_host_cleansed model."
       data_tests:
         - not_null
         - relationships:
             arguments:
               to: ref('dim_host_cleansed')
               field: host_id

     - name: room_type
       description: "Type of room available for booking."
       data_tests:
         - accepted_values:
            values: ['Entire home/apt',
                        'Private room',
                        'Shared room',
                        'Hotel room']
            config:
               severity: warn

     - name: minimum_nights
       description: '{{ doc("dim_listings_cleansed__minimum_nights") }}'
       tests:
        - positive_values

  - name: dim_host_cleansed
    versions:
      - v: 1
        defined_in: dim_host_cleansed
        deprecation_date: 2027-01-01
      - v: 2
        columns:
          - include: '*'
            exclude: [host_name]
          - name: host_name
            description: "The name of the host. If the host name is missing, it will be replaced with 'N/A'."
            data_type: string
            constraints:
              - type: not_null
    latest_version: 1
    description: "This model contains the cleansed host data for Airbnb."
    config:
      contract:
        enforced: true
    columns:
      - name: host_id
        description: "Unique identifier for each host."
        data_type: integer
        data_tests:
          - unique
          - not_null
      - name: host_name
        data_type: string
        data_tests:
          - not_null
      - name: is_superhost
        data_type: string
      - name: updated_at
        data_type: timestamp
      - name: created_at
        data_type: timestamp
  
  - name: dim_listings_w_hosts
    tests:
      - dbt_expectations.expect_table_row_count_to_equal_other_table:
          compare_model: source('airbnb', 'listings')
    columns:
      - name: price
        tests:
          - dbt_expectations.expect_column_quantile_values_to_be_between:
              arguments:
                quantile: .99
                min_value: 50 # (Optional)
                max_value: 500 # (Optional)
          - dbt_expectations.expect_column_max_to_be_between:
              arguments:
                max_value: 5000 # (Optional)
              config:
                severity: warn
          - dbt_expectations.expect_column_values_to_be_of_type:
              arguments:
                column_type: number
