airbnb:
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('DBT_USER') }}"
      password: "{{ env_var('DBT_PASSWORD') }}"

      role: TRANSFORM
      
      database: AIRBNB
      schema: DBT_DEV
      threads: 4
      warehouse: COMPUTE_WH

    prod:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('DBT_USER') }}"
      password: "{{ env_var('DBT_PASSWORD') }}"

      role: TRANSFORM
      
      database: AIRBNB
      schema: "DBT_{{ env_var('DBT_ENV_NAME') | upper | trim}}"
      threads: 4
      warehouse: COMPUTE_WH
  target: dev
    
